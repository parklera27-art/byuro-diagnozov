<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#f5edda;--ink:#24221f;--red:#a6322c;--muted:#797165;--line:#c7baa3}*{box-sizing:border-box}body{margin:0;background:#292b2a;color:var(--ink);font-family:'DM Sans',Arial,sans-serif;min-height:100vh;padding:28px 14px}.shell{max-width:720px;margin:auto}.paper{position:relative;background:var(--paper);padding:clamp(24px,6vw,56px);border:1px solid #b5a78c;box-shadow:0 18px 60px #0005;min-height:580px;background-image:repeating-linear-gradient(0deg,transparent,transparent 3px,#6d513405 4px)}.paper:before{content:'';pointer-events:none;position:absolute;inset:10px;border:1px solid #a99b80}.content{position:relative;z-index:1}.top{display:flex;justify-content:space-between;align-items:start;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:17px}.agency{font-size:10px;letter-spacing:.19em;font-weight:700;line-height:1.7}.seal{border:2px solid var(--red);color:var(--red);font-size:10px;letter-spacing:.12em;font-weight:800;padding:8px;transform:rotate(8deg);text-align:center;max-width:130px}h1,h2,h3{font-family:'Playfair Display',Georgia,serif}h1{font-size:clamp(40px,8vw,67px);line-height:1.04;margin:48px 0 20px}h2{font-size:clamp(28px,5vw,42px);line-height:1.17;margin:24px 0}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--red);margin-top:35px}.lead{font-size:16px;line-height:1.7;max-width:500px}.small{font-size:12px;color:var(--muted);line-height:1.6}.field-label{display:block;font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;margin:30px 0 10px}input{width:100%;padding:16px;background:transparent;border:0;border-bottom:2px solid var(--ink);border-radius:0;font:600 19px 'DM Sans',sans-serif;color:var(--ink);outline:none}input:focus{border-color:var(--red)}button{font-family:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #d89b59;outline-offset:3px}.primary{background:var(--ink);color:#fff;border:2px solid var(--ink);padding:15px 20px;font-size:12px;letter-spacing:.1em;font-weight:700;text-transform:uppercase;margin-top:25px;transition:transform .15s}.primary:hover{transform:translateY(-2px);background:var(--red);border-color:var(--red)}.secondary{background:transparent;color:var(--ink);border:1px solid var(--ink);padding:13px 17px;font-size:12px;font-weight:700;letter-spacing:.04em}.secondary:hover{background:#e6d8bc}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 14px;color:#eee6d8;font-size:11px;letter-spacing:.12em}.sound{background:none;border:1px solid #c7bbab;color:#f3e8d4;padding:8px 12px}.progress{height:3px;background:#d9cdb8;margin:20px 0 30px}.progress>div{height:100%;background:var(--red);transition:width .25s}.answer{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff6e6;padding:16px 17px;margin:10px 0;font-size:15px;line-height:1.45;color:var(--ink);transition:background .15s,transform .15s}.answer:hover:not(:disabled){background:#ead9bc;transform:translateX(3px)}.answer:disabled{cursor:default}.letter{font-weight:800;color:var(--red);margin-right:12px}.alert{border:2px solid var(--red);padding:25px;margin-top:32px;text-align:center}.alert h2{color:var(--red)}.alert p{line-height:1.65}.red{color:var(--red)}.secret{background:repeating-linear-gradient(135deg,#292722,#292722 8px,#393630 8px,#393630 16px);color:#fff;padding:25px;text-align:center;margin:35px 0;letter-spacing:.25em;font-weight:800;font-size:22px;border:3px double #8e8372}.stamp{display:inline-block;border:5px double var(--red);color:var(--red);padding:12px 15px;max-width:290px;font-weight:800;font-size:clamp(14px,3.5vw,20px);line-height:1.1;text-align:center;letter-spacing:.06em;transform:rotate(-10deg);margin:22px 0 10px}.stamp.drop{animation:stamp .5s cubic-bezier(.2,1.3,.4,1) both}@keyframes stamp{0%{transform:scale(3) rotate(-22deg);opacity:0}75%{transform:scale(.94) rotate(-10deg);opacity:1}100%{transform:scale(1) rotate(-10deg)}}.shake{animation:shake .35s}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-2px)}}.result-title{font-size:clamp(30px,6vw,48px);margin:12px 0 20px}.rule{border:0;border-top:1px solid var(--line);margin:24px 0}.metric{font-family:'Playfair Display',serif;font-size:40px;color:var(--red);font-weight:700}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.actions .primary{margin-top:0}.loading{min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.spinner{width:46px;height:46px;border:3px solid #d3c5ae;border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.footer{margin-top:45px;padding-top:12px;border-top:1px solid var(--line);font-size:10px;letter-spacing:.1em;color:var(--muted);display:flex;justify-content:space-between;gap:10px}.hidden{display:none!important}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#24221f;color:#fff;padding:12px 20px;border:1px solid #aaa;z-index:5;font-size:13px;box-shadow:0 8px 25px #0004}.subhead{font-size:12px;letter-spacing:.15em;color:var(--red);font-weight:800}.download-note{font-size:12px;color:var(--muted);line-height:1.6}.footer-note{margin-top:15px;font-size:11px;color:#ccc;text-align:center}@media(max-width:480px){body{padding:12px 9px}.paper{min-height:550px}.top{align-items:center}.agency{font-size:9px}.seal{font-size:8px}.answer{font-size:14px}.actions>*{width:100%}.footer{font-size:9px}}
</style>

<body>
<div class="shell"><div class="toolbar"><span>ДЕЛО ОСОБОЙ СОМНИТЕЛЬНОСТИ</span><button id="soundBtn" class="sound" type="button" aria-label="Включить или выключить звук">🔊 ЗВУК ВКЛ.</button></div><main id="paper" class="paper"><div class="content"><header class="top"><div class="agency">БЮРО<br>СОМНИТЕЛЬНЫХ<br>ДИАГНОЗОВ</div><div class="seal">ГОСУДАРСТВЕННО<br>НЕ ОДОБРЕНО</div></header><div id="app" aria-live="polite"></div><footer class="footer"><span>БСД • ФОРМА № 404</span><span>ЗДРАВЫЙ СМЫСЛ НЕ ГАРАНТИРУЕТСЯ</span></footer></div></main><div class="footer-note">Шуточный тест. Никакой медицинской диагностики.</div></div><div id="toast" class="toast hidden" role="status"></div>
<script>
const questions=[
{q:'Если бы твой будильник мог говорить, какие были бы его последние слова?',a:['«Убери тапок. Давай договоримся».','«У меня семья и маленькие секундомеры!»','«Мы можем инсценировать мою поломку!»','«Ты же сам меня на это время поставил, псих!»'],weights:[[0,3],[1,4],[2,7],[5,6]]},
{q:'Какой звук издаёт твоя психика при запуске?',a:['«ХРРР-БДЫЩЬ». Где-то отвалилась важная деталь.','«Кря». Почему-то именно «кря».','Гудок парохода. Куда плывём — неизвестно.','Тишина. Даже психика отказалась выходить на работу.'],weights:[[1,4],[0,5],[2,6],[3,7]]},
{q:'Ты случайно стал президентом маленькой страны. Какой первый указ?',a:['Переименовать страну в «Ну и ладно».','Учредить Министерство бессмысленных, но красивых решений.','Ввести налог на тупые вопросы. Закрыть государственный долг за сутки.','Ввести ойкоины. Каждая финансовая операция сопровождается словом «ой».'],weights:[[3,7],[2,6],[5,7],[0,1]]},
{q:'Какой овощ мог бы победить тебя в честной драке?',a:['Капуста. Нанесла 48 ударов листьями.','Свёкла. После драки всё выглядело как место преступления.','Репа. Пришла с дедом, бабкой и группой поддержки.','Хрен. Я бы с ним вообще не связывался.'],weights:[[0,6],[4,1],[2,3],[5,7]]},
{q:'Тебе написали «Есть серьёзный разговор». Какую страну выбираешь для эмиграции?',a:['Ватикан. Уйду в монастырь. Возможно, сразу в Папы.','Францию. Буду драматично смотреть в окно с круассаном.','Люксембург. Никто не догадается искать меня именно там.','Египет. Спрячусь в пирамиде. Меня там не найдут.'],weights:[[5,6],[1,3],[2,4],[0,7]]},
{q:'По какой статье тебя сегодня следует освободить от всех обязанностей?',a:['Статья 228. Хранение особо крупных запасов лени.','Статья 101. Превышение допустимого уровня охреневания.','Статья 007. Гражданин находится под прикрытием одеяла.','Статья 001. Гражданин проснулся, и этого уже достаточно.'],weights:[[7,3],[0,6],[2,4],[1,5]]}
];
const diagnoses=[
{emoji:'🦆',name:'Утка в состоянии аффекта',description:'Внешне ты спокоен. Внутри 47 уток одновременно кричат «КРЯ», и ни одна не знает, что происходит.',advice:'Не принимать важных решений вблизи водоёмов.',stamp:'НЕ КРЯКАТЬ БЕЗ НАДЗОРА',percent:13},
{emoji:'🧃',name:'Пакетик нервного сока',description:'Тебя слегка потрясли жизненные обстоятельства. Теперь достаточно одного неловкого движения, чтобы содержимое оказалось на окружающих.',advice:'Не открывать до стабилизации обстановки.',stamp:'ВСКРЫВАТЬ С ОСТОРОЖНОСТЬЮ',percent:27},
{emoji:'🦝',name:'Енот с доступом к интернету',description:'У тебя есть Wi-Fi, свободное время и подозрительно много идей. Общество пока не осознаёт масштаб угрозы.',advice:'Ограничить доступ к кнопке «Отправить всем».',stamp:'ОПАСЕН ПРИ НАЛИЧИИ WI-FI',percent:89},
{emoji:'🪑',name:'Табуретка эмоциональной поддержки',description:'Все на тебя опираются, хотя у тебя самого одна ножка держится исключительно на мате и силе привычки.',advice:'При первых признаках перегрузки демонстративно сложиться.',stamp:'НЕ ПОДЛЕЖИТ НАГРУЗКЕ',percent:41},
{emoji:'🍞',name:'Батон с криминальным прошлым',description:'С виду мягкий и безобидный. Но комиссия обнаружила, что ты неоднократно участвовал в тёмных делах с маслом.',advice:'Не приближаться к тостеру без адвоката.',stamp:'СОСТОИТ НА УЧЁТЕ',percent:66},
{emoji:'🐸',name:'Жаба с дипломом психолога',description:'Ты способен диагностировать чужие проблемы по одному взгляду. Свои предпочитаешь списывать на ретроградный Меркурий.',advice:'Прекратить консультировать людей из ближайшего болота.',stamp:'ЛИЦЕНЗИЯ ПОД ВОПРОСОМ',percent:74},
{emoji:'🍄',name:'Гриб с комплексом Наполеона',description:'Ростом невелик, амбициями захватил пол-Европы. Особенно опасен после дождя и малейшей критики.',advice:'Воздержаться от вторжения в соседнюю грибницу.',stamp:'СКЛОНЕН К ЗАХВАТУ ТЕРРИТОРИЙ',percent:181},
{emoji:'🦥',name:'Ленивец с полномочиями прокурора',description:'Ты готов возбудить дело против любого, кто нарушает твой покой. Рассмотрение жалоб занимает от трёх до пяти рабочих лет.',advice:'Санкционировать себе внеочередной сон. Без права обжалования.',stamp:'ОБЖАЛОВАНИЮ НЕ ПОДЛЕЖИТ',percent:8}
];
let name='',step=0,choices=[],resultIndex=0,muted=false,audioCtx=null,loadingTimers=[];
const app=document.getElementById('app'),paper=document.getElementById('paper'),soundBtn=document.getElementById('soundBtn');
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.classList.add('hidden'),2600)}
function audio(){if(muted)return null;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}catch(e){return null}}
function tone(freq,dur=.08,type='sine',volume=.08,delay=0,endFreq=freq){const ctx=audio();if(!ctx)return;const now=ctx.currentTime+delay,o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(Math.max(1,freq),now);o.frequency.exponentialRampToValueAtTime(Math.max(1,endFreq),now+dur);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),now+.012);g.gain.exponentialRampToValueAtTime(.0001,now+dur);o.connect(g);g.connect(ctx.destination);o.start(now);o.stop(now+dur+.02)}
function sound(kind){if(kind==='click')tone(700,.045,'triangle',.045,0,430);if(kind==='alert'){tone(760,.16,'square',.045);tone(760,.16,'square',.045,.25)}if(kind==='unlock'){tone(270,.09,'square',.045);tone(450,.12,'triangle',.05,.11)}if(kind==='stamp'){tone(100,.19,'triangle',.22,0,48);tone(180,.06,'sawtooth',.045)}if(kind==='fanfare'){tone(392,.16,'triangle',.065);tone(523,.16,'triangle',.065,.18);tone(659,.22,'triangle',.065,.36);tone(611,.4,'sawtooth',.05,.6)}}
soundBtn.onclick=()=>{muted=!muted;soundBtn.textContent=muted?'🔇 ЗВУК ВЫКЛ.':'🔊 ЗВУК ВКЛ.';if(!muted)sound('click')};
function renderStart(){app.innerHTML=`<div class="eyebrow">Форма № 404 / первичный осмотр</div><h1>КТО ТЫ<br>СЕГОДНЯ?</h1><p class="lead">Шесть вопросов. Одно сомнительное заключение. Комиссия не несёт ответственности за внезапное самопознание.</p><label class="field-label" for="personName">Фамилия, имя или другое подозрительное обозначение</label><input id="personName" maxlength="40" autocomplete="off" placeholder="Как к вам обращаться, гражданин?" value="${escapeHTML(name)}"><button class="primary" id="start">НАЧАТЬ ЭКСПЕРТИЗУ →</button><p class="small">Все сведения будут использованы исключительно против здравого смысла.</p>`;document.getElementById('start').onclick=()=>{name=document.getElementById('personName').value.trim().replace(/\s+/g,' ')||'Неустановленный гражданин';step=0;choices=[];sound('click');renderQuestion()};document.getElementById('personName').onkeydown=e=>{if(e.key==='Enter')document.getElementById('start').click()}}
function renderQuestion(){const q=questions[step];app.innerHTML=`<div class="eyebrow">Протокол опроса • вопрос ${step+1} из ${questions.length}</div><div class="progress"><div style="width:${step/questions.length*100}%"></div></div><h2>${escapeHTML(q.q)}</h2><div id="answers">${q.a.map((a,i)=>`<button class="answer" data-answer="${i}"><span class="letter">${'АБВГ'[i]}.</span>${escapeHTML(a)}</button>`).join('')}</div><p class="small">Отвечайте искренне. Врать комиссии бессмысленно: она всё равно ничего не понимает.</p>`;document.querySelectorAll('[data-answer]').forEach(btn=>btn.onclick=()=>{const value=Number(btn.dataset.answer);choices.push(value);sound('click');document.querySelectorAll('[data-answer]').forEach(b=>b.disabled=true);setTimeout(()=>{step++;if(step===3)renderAlert();else if(step<questions.length)renderQuestion();else renderLoading()},180)})}
function renderAlert(){app.innerHTML=`<div class="eyebrow">Внеплановое вмешательство</div><div class="alert"><div style="font-size:40px">⚠</div><h2>ВНИМАНИЕ!</h2><p><b>Ваши ответы вызывают подозрения.</b></p><p>Автоматическая система зафиксировала признаки нестандартной жизнедеятельности. Комиссия требует объяснений.</p><button id="continue" class="primary">Я И САМ В АХУЕ →</button></div><p class="small">Это не предупреждение. Это констатация.</p>`;sound('alert');document.getElementById('continue').onclick=()=>{sound('click');renderQuestion()}}
function calculate(){const scores=Array(8).fill(0);choices.forEach((choice,i)=>{const [a,b]=questions[i].weights[choice];scores[a]+=3;scores[b]+=2});const highest=Math.max(...scores);const tied=scores.map((v,i)=>v===highest?i:-1).filter(i=>i>=0);const signature=choices.reduce((sum,c,i)=>sum+(c+1)*(i+3)*(i+7),0);return tied[signature%tied.length]}
function renderLoading(){resultIndex=calculate();app.innerHTML=`<div class="eyebrow">Стадия заключения</div><div class="loading"><div class="spinner"></div><h2>Комиссия изучает материалы…</h2><p id="loadingText" class="lead">Проверяем адекватность…</p></div>`;const texts=['Проверка провалена.','Вызываем второго специалиста…','Второй специалист уволился.','Заключение засекречено.'];texts.forEach((s,i)=>loadingTimers.push(setTimeout(()=>{const e=document.getElementById('loadingText');if(e)e.textContent=s},(i+1)*850)));loadingTimers.push(setTimeout(renderSecret,4100))}
function renderSecret(){app.innerHTML=`<div class="eyebrow">Личное дело № ${fileNumber()}</div><h2>Заключение готово</h2><p class="lead">Сведения о гражданине <b>${escapeHTML(name)}</b> признаны потенциально опасными для общественного спокойствия.</p><div class="secret">🔒 СЕКРЕТНО<br><span style="font-size:11px;letter-spacing:.13em">ДОСТУП ОГРАНИЧЕН</span></div><p class="small">Вскрытие документа осуществляется на ваш страх, риск и репутацию.</p><button id="reveal" class="primary">Я ГОТОВ УЗНАТЬ ПРАВДУ →</button>`;document.getElementById('reveal').onclick=()=>{sound('unlock');renderResult()}}
function fileNumber(){return String(1000+choices.reduce((s,c,i)=>s+(c+1)*(i+13)*17,0)%9000)}
function renderResult(){const d=diagnoses[resultIndex];app.innerHTML=`<div class="eyebrow">Рассекречено • дело № ${fileNumber()}</div><div class="subhead" style="margin-top:30px">ГРАЖДАНИН: ${escapeHTML(name.toUpperCase())}</div><h2 class="result-title">${d.emoji} ${escapeHTML(d.name)}</h2><p class="lead">${escapeHTML(d.description)}</p><hr class="rule"><div class="subhead">ГОТОВНОСТЬ К ЖИЗНИ</div><div class="metric">${d.percent}%</div><p class="small">Данные приблизительные. Калькулятор комиссии находится под следствием.</p><hr class="rule"><div class="subhead">ПРЕДПИСАНИЕ</div><p class="lead">${escapeHTML(d.advice)}</p><div style="text-align:center"><div id="resultStamp" class="stamp drop">${escapeHTML(d.stamp)}</div></div><div class="actions"><button id="download" class="primary">↓ СОХРАНИТЬ СЕРТИФИКАТ</button><button id="copy" class="secondary">КОПИРОВАТЬ РЕЗУЛЬТАТ</button><button id="again" class="secondary">ПРОЙТИ ЗАНОВО ↻</button></div><p class="download-note">Сертификат сохраняется вертикальной картинкой PNG — удобно отправить в чат.</p>`;setTimeout(()=>{paper.classList.add('shake');sound('stamp');setTimeout(()=>paper.classList.remove('shake'),400)},200);document.getElementById('download').onclick=downloadCertificate;document.getElementById('copy').onclick=copyResult;document.getElementById('again').onclick=()=>{name='';step=0;choices=[];renderStart()}}
function resultText(){const d=diagnoses[resultIndex];return `БЮРО СОМНИТЕЛЬНЫХ ДИАГНОЗОВ\nЛичное дело № ${fileNumber()}\nГражданин: ${name}\nДиагноз: ${d.emoji} ${d.name}\nГотовность к жизни: ${d.percent}%\n${d.description}\nПредписание: ${d.advice}\n🔴 ${d.stamp}\nЗаключение окончательное. Здравый смысл не гарантируется.`}
async function copyResult(){const text=resultText();try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text)}else{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw Error('copy failed')}showToast('Заключение скопировано. Общество предупреждено.')}catch(e){showToast('Копирование недоступно. Можно сохранить сертификат.')}}
function wrapLines(ctx,text,maxWidth){const lines=[];for(const paragraph of String(text).split('\n')){let line='';for(const word of paragraph.split(/\s+/)){const trial=line?line+' '+word:word;if(ctx.measureText(trial).width>maxWidth&&line){lines.push(line);line=word}else line=trial}lines.push(line)}return lines}
function block(ctx,text,x,y,maxWidth,lineHeight,maxLines=100){const lines=wrapLines(ctx,text,maxWidth).slice(0,maxLines);for(const l of lines){ctx.fillText(l,x,y);y+=lineHeight}return y}
